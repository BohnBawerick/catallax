name: branch check

on:
  push:
    branches-ignore: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: branch-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"

jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: stable
          components: rustfmt, clippy
          step-name: Set up Rust toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace -- -D warnings
      - run: cargo build --locked -p catallax-cli --bins
