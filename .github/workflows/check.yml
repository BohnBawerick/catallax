name: check

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Build and attest every release artifact without publishing
        type: boolean
        default: false
      replay_summary:
        description: Public replay aggregate for this exact commit, required for release_dry_run
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/release/') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  fmt:
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Edge hunt
        run: python3 -B -m unittest discover -s tools/edge-hunt -v
      - name: Release evidence policy
        run: python3 -B -m unittest discover -s tools/release -p 'test_*.py' -v

  clippy:
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  tests:
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Release test partition
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo nextest run --workspace --release --partition "count:$SHARD/4" --no-fail-fast --test-threads 2

  build:
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p catallax-cli --bins
      - run: target/release/catallax about
      - run: target/release/exact-brep about
      - run: target/release/catallax-verify about
      - name: Verification driver
        run: python3 -B -m unittest discover -s .claude/skills/verify-catallax/scripts -p 'test_*.py' -v
      - name: OpenCASCADE STEP regressions
        run: |
          python3 -m venv "$RUNNER_TEMP/occt"
          "$RUNNER_TEMP/occt/bin/pip" install cadquery-ocp==8.0.1.1.0
          "$RUNNER_TEMP/occt/bin/python" -B -m unittest discover -s tools/step-regressions -v
      - name: Generated comparison page
        run: python3 -B site/render/comparison.py --check
      - run: cargo test --workspace --release --doc

  # check.yml already exists on main, so it can dispatch a new reusable release
  # workflow on a branch before that workflow has landed on main.
  release-evidence:
    if: github.event_name == 'workflow_dispatch' && (inputs.release_dry_run || inputs.replay_summary != '')
    uses: ./.github/workflows/release-evidence.yml
    with:
      replay_summary: ${{ inputs.replay_summary }}
      historical_replay: ${{ inputs.release_dry_run }}

  release-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run
    needs: release-evidence
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      evidence_run: ${{ format('{0}', github.run_id) }}

  check:
    if: always()
    needs: [fmt, clippy, build, tests, release-evidence, release-dry-run]
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Require every gate and partition
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          optional = {"release-evidence", "release-dry-run"}
          failed = {name: job["result"] for name, job in results.items()
                    if job["result"] != "success" and not (name in optional and job["result"] == "skipped")}
          if failed:
              raise SystemExit(f"Required checks did not pass: {failed}")
          print("Format, clippy, both binaries, release tests and doc tests passed")
          PY
