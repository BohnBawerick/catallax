name: check

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Build and attest every release artifact without publishing
        type: boolean
        default: false
      replay_summary:
        description: Public replay aggregate for this exact commit, required for release_dry_run
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: check-${{ github.workflow }}-${{ startsWith(github.ref, 'refs/heads/release/') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  select:
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    outputs:
      fmt: ${{ steps.select.outputs.fmt }}
      clippy: ${{ steps.select.outputs.clippy }}
      tests: ${{ steps.select.outputs.tests }}
      build: ${{ steps.select.outputs.build }}
      replay: ${{ steps.select.outputs.replay }}
      scoreboard: ${{ steps.select.outputs.scoreboard }}
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Select base and candidate rules
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_dry_run || inputs.replay_summary != '') }}
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.release_dry_run }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE=$(git rev-parse HEAD^); fi
          flags=()
          if [[ "$RELEASE_EVIDENCE" == true ]]; then flags+=(--release-evidence); fi
          if [[ "$RELEASE_DRY_RUN" == true ]]; then flags+=(--release-dry-run); fi
          python3 -B tools/checks/checks.py select --base "$BASE" --head "$HEAD" \
            --event "$EVENT" --ref "$REF" --out "$RUNNER_TEMP/selection.json" \
            --github-output "$GITHUB_OUTPUT" "${flags[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: check-selection
          path: ${{ runner.temp }}/selection.json
          if-no-files-found: error

  fmt:
    needs: select
    if: needs.select.outputs.fmt == 'true'
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: check-selection
          path: ${{ runner.temp }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Check policy and routing
        run: python3 -B -m unittest discover -s tools/checks -v
      - name: Edge hunt
        run: python3 -B -m unittest discover -s tools/edge-hunt -v
      - name: Release evidence policy
        run: python3 -B -m unittest discover -s tools/release -p 'test_*.py' -v
      - uses: ./.github/actions/check-evidence
        with:
          job: fmt

  clippy:
    needs: select
    if: needs.select.outputs.clippy == 'true'
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: check-selection
          path: ${{ runner.temp }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint selected crates and consumers
        env:
          PACKAGES: ${{ needs.select.outputs.packages }}
        run: |
          read -r -a packages <<< "$PACKAGES"
          cargo clippy "${packages[@]}" --all-targets -- -D warnings
      - uses: ./.github/actions/check-evidence
        with:
          job: clippy

  tests:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: check-selection
          path: ${{ runner.temp }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Release test partition
        env:
          SHARD: ${{ matrix.shard }}
          PACKAGES: ${{ needs.select.outputs.packages }}
        run: |
          read -r -a packages <<< "$PACKAGES"
          cargo nextest run "${packages[@]}" --release --partition "count:$SHARD/4" --no-fail-fast --test-threads 2
      - name: Selected documentation tests
        if: matrix.shard == 1
        env:
          PACKAGES: ${{ needs.select.outputs.packages }}
        run: |
          read -r -a packages <<< "$PACKAGES"
          cargo test "${packages[@]}" --release --doc
      - uses: ./.github/actions/check-evidence
        with:
          job: tests
          partition: ${{ matrix.shard }}

  build:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: check-selection
          path: ${{ runner.temp }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p catallax-cli --bins
      - run: target/release/catallax about
      - run: target/release/exact-brep about
      - run: target/release/catallax-verify about
      - name: Verification driver
        run: python3 -B -m unittest discover -s .claude/skills/verify-catallax/scripts -p 'test_*.py' -v
      - name: OpenCASCADE STEP regressions
        run: |
          python3 -m venv "$RUNNER_TEMP/occt"
          "$RUNNER_TEMP/occt/bin/pip" install cadquery-ocp==8.0.1.1.0
          "$RUNNER_TEMP/occt/bin/python" -B -m unittest discover -s tools/step-regressions -v
      - name: Generated comparison page
        run: python3 -B site/render/comparison.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: check-binary
          path: target/release/catallax-verify
          if-no-files-found: error
      - uses: ./.github/actions/check-evidence
        with:
          job: build
          binary: target/release/catallax-verify

  replay:
    needs: [select, build]
    if: needs.select.outputs.replay == 'true'
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: check-selection
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: check-binary
          path: ${{ runner.temp }}/binary
      - run: chmod +x "$RUNNER_TEMP/binary/catallax-verify"
      - name: Pinned private corpus
        uses: actions/checkout@v4
        with:
          repository: BohnBawerick/catallax-proof-inputs
          ref: ad3d261cce764b58e576e595679455592ae29e8f
          ssh-key: ${{ secrets.CATALLAX_PROOF_INPUTS_DEPLOY_KEY }}
          persist-credentials: false
          path: .private-proof-inputs
          sparse-checkout: /sets/baseline477-inputs.json
          sparse-checkout-cone-mode: false
      - name: Fresh fixed-configuration earlier answers
        id: replay
        run: |
          python3 -B tools/checks/checks.py replay \
            --inputs .private-proof-inputs/sets/baseline477-inputs.json \
            --binary "$RUNNER_TEMP/binary/catallax-verify" \
            --out "$RUNNER_TEMP/replay" --summary "$RUNNER_TEMP/replay-summary.json"
      - name: Direct no-healing STEP validity
        if: always() && (steps.replay.outcome == 'success' || steps.replay.outcome == 'failure')
        run: |
          python3 -m venv "$RUNNER_TEMP/occt"
          "$RUNNER_TEMP/occt/bin/pip" install cadquery-ocp==8.0.1.1.0
          "$RUNNER_TEMP/occt/bin/python" -B tools/checks/raw_step.py "$RUNNER_TEMP/replay/run.json" \
            | tee "$RUNNER_TEMP/raw-step-summary.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-replay-summary
          path: ${{ runner.temp }}/replay-summary.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-raw-step-summary
          path: ${{ runner.temp }}/raw-step-summary.json
          if-no-files-found: ignore
      - uses: ./.github/actions/check-evidence
        with:
          job: replay
          binary: ${{ runner.temp }}/binary/catallax-verify
          summary: ${{ runner.temp }}/replay-summary.json

  scoreboard:
    needs: [select, build]
    if: needs.select.outputs.scoreboard == 'true'
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: check-selection
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: check-binary
          path: ${{ runner.temp }}/binary
      - name: OpenCASCADE scratch environment
        run: |
          chmod +x "$RUNNER_TEMP/binary/catallax-verify"
          python3 -m venv "$RUNNER_TEMP/occt"
          "$RUNNER_TEMP/occt/bin/pip" install cadquery-ocp==8.0.1.1.0
      - name: Build, compare and import target parts
        run: |
          python3 -B .claude/skills/verify-catallax/scripts/control-catallax.py parts parts \
            --binary "$RUNNER_TEMP/binary/catallax-verify" --out "$RUNNER_TEMP/parts" \
            --max-work 1000000 --occt-python "$RUNNER_TEMP/occt/bin/python" --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-parts
          path: ${{ runner.temp }}/parts
          if-no-files-found: error
      - uses: ./.github/actions/check-evidence
        with:
          job: scoreboard
          binary: ${{ runner.temp }}/binary/catallax-verify

  # Preserve the independently gated release workflow and its packaging path.
  release-evidence:
    if: github.event_name == 'workflow_dispatch' && (inputs.release_dry_run || inputs.replay_summary != '')
    uses: ./.github/workflows/release-evidence.yml
    with:
      replay_summary: ${{ inputs.replay_summary }}
      historical_replay: ${{ inputs.release_dry_run }}

  release-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.release_dry_run
    needs: release-evidence
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    with:
      evidence_run: ${{ format('{0}', github.run_id) }}

  check:
    if: always()
    needs: [select, fmt, clippy, build, tests, replay, scoreboard, release-evidence, release-dry-run]
    runs-on: ${{ fromJSON(vars.USE_LOCAL_RUNNERS == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","ci-linux-local"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: check-selection
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          pattern: check-proof-*
          path: ${{ runner.temp }}/evidence
          merge-multiple: true
      - name: Require every selected job, partition and exact identity
        env:
          RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[].name' > "$RUNNER_TEMP/job-names"
          python3 -B tools/checks/checks.py gate --plan "$RUNNER_TEMP/selection.json" \
            --evidence "$RUNNER_TEMP/evidence" --jobs "$RUNNER_TEMP/job-names"

  timings:
    needs: [select, check]
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: check-selection
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        if: needs.select.outputs.replay == 'true'
        with:
          name: check-replay-summary
          path: ${{ runner.temp }}
      - name: Record completed-gate timings
        env:
          GH_TOKEN: ${{ github.token }}
          CATALLAX_GITHUB_CLI: gh
        run: |
          flags=()
          if [[ -f "$RUNNER_TEMP/replay-summary.json" ]]; then
            flags+=(--replay-summary "$RUNNER_TEMP/replay-summary.json")
          fi
          python3 -B tools/checks/metrics.py --run-id "$GITHUB_RUN_ID" --label "$GITHUB_REF" \
            --selection "$RUNNER_TEMP/selection.json" "${flags[@]}" --out "$RUNNER_TEMP/timings.json"
      - uses: actions/upload-artifact@v4
        with:
          name: check-timings
          path: ${{ runner.temp }}/timings.json
          if-no-files-found: error
