name: rounded STEP speed

on:
  pull_request:
    paths:
      - 'crates/catallax-numbers/**'
      - 'crates/catallax-boolean/**'
      - 'crates/catallax-intersect/**'
      - 'crates/catallax-step/**'
      - 'crates/catallax-cli/examples/rounded_step.rs'
      - 'crates/catallax-cli/examples/edit_answer.rs'
      - 'tools/checks/edit_speed.py'
      - 'tools/checks/test_edit_speed.py'
      - 'tools/checks/check_edit_date.py'
      - '.github/workflows/rounded-step-speed.yml'

permissions:
  contents: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: rounded-step-probes
          workspaces: |
            baseline -> target
            candidate -> target
      - name: Build both revisions with the same probe
        run: |
          cp candidate/crates/catallax-cli/examples/rounded_step.rs baseline/crates/catallax-cli/examples/rounded_step.rs
          cargo build --manifest-path baseline/Cargo.toml --locked --release -p catallax-cli --example rounded_step -j 2
          cargo build --manifest-path candidate/Cargo.toml --locked --release -p catallax-cli --example rounded_step -j 2
      - name: Alternate on one core and compare every answer
        env:
          PROOF: ${{ runner.temp }}/rounded-step-speed
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, statistics, subprocess
          from candidate.tools.checks.edit_speed import read_native_work
          out = pathlib.Path(os.environ['PROOF'])
          out.mkdir()
          core = min(os.sched_getaffinity(0))
          os.sched_setaffinity(0, {core})
          samples = []
          reference = None
          reference_work = None
          for pair in range(4):
              order = ['baseline', 'candidate'] if pair % 2 == 0 else ['candidate', 'baseline']
              for revision in order:
                  dest = out / f'{pair}-{revision}'
                  load = os.getloadavg()
                  run = subprocess.run([f'{revision}/target/release/examples/rounded_step', str(dest)],
                                       text=True, capture_output=True, check=True)
                  (dest / 'stderr.txt').write_text(run.stderr)
                  answer = tuple((dest / name).read_bytes() for name in ['answer.step', 'answer.txt'])
                  work = read_native_work(dest / 'work.txt', reference_work)
                  if reference is None:
                      reference, reference_work = answer, work
                  assert answer == reference, f'answer, certificate or STEP bytes changed: {dest}'
                  row = dict(pair=pair, warmup=pair == 0, revision=revision,
                             base_work=reference_work, head_work=work if revision == 'candidate' else None,
                             accepted_work=work,
                             load_before=load, load_after=os.getloadavg(), **json.loads(run.stdout))
                  samples.append(row)
                  print(json.dumps(row), flush=True)
          report = dict(base=os.environ['BASE_SHA'], head=os.environ['HEAD_SHA'], core=core,
                        samples=samples, comparison='identical STEP bytes, report and marks; accepted work never increases',
                        median_writer_ms={revision: statistics.median(
                            row['writer_ms'] for row in samples if row['revision'] == revision and not row['warmup'])
                            for revision in ['baseline', 'candidate']})
          (out / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rounded-step-speed
          path: ${{ runner.temp }}/rounded-step-speed
          if-no-files-found: error

  edits:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      WGPU_BACKEND: vulkan
      LP_NUM_THREADS: '1'
      XDG_RUNTIME_DIR: /tmp/edit-speed-runtime
      CARGO_PROFILE_RELEASE_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: BohnBawerick/soliddraft
          ref: 04f45bf40c119d5387836173727a3905db094e4a
          path: app
          persist-credentials: false
      - name: Check exact-answer and non-increasing-work boundaries
        run: python3 -m unittest discover -s candidate/tools/checks -p test_edit_speed.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: released-edit-probes
          workspaces: |
            baseline -> target
            candidate -> target
            app -> ${{ runner.temp }}/edit-build
      - name: Pin the released title date for the whole run
        run: echo "SOURCE_DATE_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
      - name: Prepare the released application's software viewport
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          # Ubuntu 26.04 moved perf out of linux-tools-* into its own package.
          perf_package=""
          if apt-cache show linux-perf > /dev/null 2>&1; then perf_package=linux-perf; fi
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends mesa-vulkan-drivers valgrind linux-tools-generic $perf_package
          sudo sysctl -w kernel.perf_event_paranoid=-1
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Build identical native probes and the two application executables
        run: |
          cp candidate/crates/catallax-cli/examples/edit_answer.rs baseline/crates/catallax-cli/examples/edit_answer.rs
          for revision in baseline candidate; do
            cargo build --manifest-path "$revision/Cargo.toml" --locked --release -p catallax-cli --example edit_answer --bin catallax-verify -j 2
          done
          python3 candidate/tools/checks/edit_speed.py build --app app --baseline baseline --candidate candidate --binaries "$RUNNER_TEMP/edit-binaries" --out "$RUNNER_TEMP/edit-speed"
      - name: Pair the five released edits and compare every answer
        run: |
          python3 candidate/tools/checks/edit_speed.py run --app app --baseline baseline --candidate candidate --binaries "$RUNNER_TEMP/edit-binaries" --out "$RUNNER_TEMP/edit-speed"
      - name: Check released title dates across UTC midnight
        run: python3 candidate/tools/checks/check_edit_date.py --app app --out "$RUNNER_TEMP/edit-speed/date-check"
      - name: Measure captured native Boolean phases independently
        run: |
          python3 candidate/tools/checks/edit_speed.py phases --app app --baseline baseline --candidate candidate --binaries "$RUNNER_TEMP/edit-binaries" --out "$RUNNER_TEMP/edit-speed"
      - name: Attribute native CPU ownership and instruction costs
        run: |
          python3 candidate/tools/checks/edit_speed.py profile --app app --baseline baseline --candidate candidate --binaries "$RUNNER_TEMP/edit-binaries" --out "$RUNNER_TEMP/edit-speed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edit-speed
          path: ${{ runner.temp }}/edit-speed
          if-no-files-found: error
