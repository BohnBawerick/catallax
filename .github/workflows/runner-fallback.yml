name: Runner queue fallback

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: [check, rounded STEP speed]
    types: [in_progress]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: runner-queue-fallback
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run is privileged. Always use the default branch, never a PR
      # ref, artifact or script. A five-minute sweep catches late queued jobs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {recover} = require('./ci/runner-fallback.cjs');
            await recover({github, context, core});
