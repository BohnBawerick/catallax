[workspace]
resolver = "3"
members = [
    "crates/catallax-numbers",
    "crates/catallax-shapes",
    "crates/catallax-topology",
    "crates/catallax-intersect",
    "crates/catallax-boolean",
    "crates/catallax-measure",
    "crates/catallax-step",
    "crates/catallax-mesh",
    "crates/catallax-recipe",
    "crates/catallax-field",
    "crates/catallax-cli",
    "crates/catallax-features",
    "crates/catallax-compare",
    "crates/catallax-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/BohnBawerick/catallax"
publish = false

[workspace.dependencies]
im = "15.1"
catallax-numbers = { path = "crates/catallax-numbers" }
catallax-shapes = { path = "crates/catallax-shapes" }
catallax-topology = { path = "crates/catallax-topology" }
catallax-intersect = { path = "crates/catallax-intersect" }
catallax-boolean = { path = "crates/catallax-boolean" }
catallax-measure = { path = "crates/catallax-measure" }
catallax-step = { path = "crates/catallax-step" }
catallax-mesh = { path = "crates/catallax-mesh" }
catallax-recipe = { path = "crates/catallax-recipe" }
catallax-field = { path = "crates/catallax-field" }
catallax-features = { path = "crates/catallax-features" }
catallax-compare = { path = "crates/catallax-compare" }
catallax-app = { path = "crates/catallax-app" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
float_cmp = "warn"

# cargo-dist's packaging profile, separate from development and test builds.
[profile.dist]
inherits = "release"
lto = "thin"
