[package]
name = "catallax-boolean"
description = "Piece 5 of catallax: the boolean engine (intersect, imprint, classify, keep, sew)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Development builds only. Records the work-span observer's dependencies;
# ordinary builds compile none of it.
work-span = [
    "catallax-numbers/work-span",
    "catallax-shapes/work-span",
    "catallax-topology/work-span",
    "catallax-intersect/work-span",
]

[dependencies]
catallax-numbers.workspace = true
catallax-shapes.workspace = true
catallax-topology.workspace = true
catallax-intersect.workspace = true
catallax-recipe.workspace = true

[[bench]]
name = "speed"
harness = false

[lints]
workspace = true

[[bench]]
name = "blind_speed"
harness = false
