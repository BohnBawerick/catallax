[package]
name = "catallax-cli"
description = "Catallax command-line front end and legacy exchange program."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.dist]
dist = true

[dependencies]
catallax-numbers.workspace = true
catallax-shapes.workspace = true
catallax-topology.workspace = true
catallax-boolean.workspace = true
catallax-intersect.workspace = true
catallax-measure.workspace = true
catallax-step.workspace = true
catallax-iges.workspace = true
catallax-recipe.workspace = true
catallax-features.workspace = true
catallax-compare.workspace = true
catallax-field.workspace = true
catallax-mesh.workspace = true
catallax-app.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
# Development builds only: enables the `work_profile` and `app_work_profile` examples.
work-profile = ["catallax-numbers/work-profile"]
# Development builds only: enables the `work_span` example.
work-span = [
    "work-profile",
    "catallax-numbers/work-span",
    "catallax-shapes/work-span",
    "catallax-topology/work-span",
    "catallax-boolean/work-span",
    "catallax-intersect/work-span",
    "catallax-features/work-span",
]

[dev-dependencies]
catallax-numbers = { workspace = true, features = ["test-deadline"] }

[lints]
workspace = true

[[bin]]
name = "exact-brep"
path = "src/main.rs"

[[bin]]
name = "catallax"
path = "src/main.rs"

[[bin]]
name = "catallax-verify"
path = "src/verify.rs"

[[example]]
name = "work_profile"
required-features = ["work-profile"]

[[example]]
name = "app_work_profile"
required-features = ["work-profile"]

[[example]]
name = "work_span"
required-features = ["work-span"]
