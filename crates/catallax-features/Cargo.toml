[package]
name = "catallax-features"
description = "Exact sketch profiles and recipe-based B-rep features."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Development builds only. Records the work-span observer's dependencies;
# ordinary builds compile none of it.
work-span = [
    "catallax-numbers/work-span",
    "catallax-shapes/work-span",
    "catallax-topology/work-span",
    "catallax-boolean/work-span",
    "catallax-intersect/work-span",
]

[dependencies]
im.workspace = true
catallax-numbers.workspace = true
catallax-shapes.workspace = true
catallax-topology.workspace = true
catallax-boolean.workspace = true
catallax-recipe.workspace = true
catallax-measure.workspace = true
catallax-intersect.workspace = true
catallax-import.workspace = true
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
catallax-field.workspace = true
catallax-mesh.workspace = true
catallax-step.workspace = true

[lints]
workspace = true

[[bench]]
name = "rebuild"
harness = false

[[example]]
name = "generated_recipe_checks"
test = true
