[package]
name = "catallax-intersect"
description = "Piece 4 of catallax: exact intersections of plane, cylinder and sphere pairs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Development builds only. Records the work-span observer's dependencies;
# ordinary builds compile none of it.
work-span = ["catallax-numbers/work-span", "catallax-shapes/work-span"]

[dependencies]
catallax-numbers.workspace = true
catallax-shapes.workspace = true
catallax-trace.workspace = true

[lints]
workspace = true

[dev-dependencies]
rug = { version = "1.28", default-features = false, features = ["integer", "rational", "float", "std"] }

[[bench]]
name = "blind_speed"
harness = false

[[bench]]
name = "speed"
harness = false
