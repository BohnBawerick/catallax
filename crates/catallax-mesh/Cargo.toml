[package]
name = "catallax-mesh"
description = "Deterministic shared-edge display meshes of exact B-rep bodies."
version.workspace = true
edition.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
publish.workspace = true

[dependencies]
catallax-numbers.workspace = true
catallax-shapes.workspace = true
catallax-topology.workspace = true
catallax-intersect.workspace = true
catallax-import.workspace = true
libm = "0.2"
spade = "2.15"
sha2 = { version = "0.10", optional = true }

[features]
# Records display results and work for tools/display-diff. Verification builds only.
display-capture = ["dep:sha2"]

[dev-dependencies]
catallax-boolean.workspace = true
catallax-features.workspace = true
catallax-recipe.workspace = true

[lints]
workspace = true
