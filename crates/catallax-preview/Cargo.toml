[package]
name = "catallax-preview"
description = "Unproved GPU mesh preview on the renderer's device"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
catallax-mesh.workspace = true
catallax-topology.workspace = true
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
spade = "2.15"

[dev-dependencies]
catallax-app.workspace = true
catallax-features.workspace = true
catallax-numbers.workspace = true
catallax-recipe.workspace = true
catallax-shapes.workspace = true
futures-channel = "0.3"
naga = { version = "30", features = ["wgsl-in"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
