[package]
name = "catallax-topology"
description = "Piece 3 of catallax: faces, edges, loops, shells and bodies over curved geometry."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Development builds only. Records the work-span observer's dependencies;
# ordinary builds compile none of it.
work-span = ["catallax-numbers/work-span", "catallax-shapes/work-span"]

[dependencies]
im.workspace = true
catallax-numbers.workspace = true
catallax-shapes.workspace = true
catallax-recipe.workspace = true

[lints]
workspace = true

[[bench]]
name = "speed"
harness = false
