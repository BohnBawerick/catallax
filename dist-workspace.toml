# cargo-dist owns platform archives; release.yml owns the evidence and publish gates.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
packages = ["catallax-cli"]
ci = []
installers = []
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
checksum = "sha256"
unix-archive = ".tar.xz"
windows-archive = ".zip"
source-tarball = false
cargo-cyclonedx = true
